[package]
name = "mock-ft"
description = "Minimal NEP-141 token with 6 decimals, used as a stand-in for USDC in sandbox tests and the dry-run demo."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
near-contract-standards.workspace = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
