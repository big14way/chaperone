[package]
name = "chaperone"
description = "Policy vault for AI agents on NEAR: function-call-key agents, signed risk verdicts, owner caveats."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
near-contract-standards.workspace = true
chaperone-tee = { path = "../../crates/chaperone-tee", features = ["contract"] }
dcap-qvl = { version = "=0.7.1", default-features = false, features = ["contract", "std", "rustcrypto", "default-x509"] }
hex = "0.4"
borsh = "1"
# dcap-qvl pulls getrandom 0.2; on wasm32 it needs a custom source (see near_getrandom in lib.rs).
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces.workspace = true
near-sandbox.workspace = true
tokio.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
anyhow = "1"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
