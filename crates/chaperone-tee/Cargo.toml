[package]
name = "chaperone-tee"
description = "Verifies a dstack (Intel TDX) attestation of the Chaperone risk checker: DCAP quote, TCB status, report data binding, RTMR3 event-log replay, approved app-compose hash and OS measurements."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dcap-qvl = { version = "=0.7.1", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[features]
# Builds dcap-qvl for a NEAR contract (wasm32-unknown-unknown).
contract = ["dcap-qvl/contract"]
