# Builds the TEE checker image (deploy/tee) from this repo and publishes it to GHCR.
# The vault approves the image by digest, so anyone can match the digest printed in the
# job summary against the one the enclave's attestation reports.
name: checker-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - checker/**
      - deploy/tee/**
      - fixtures/blocklist.json
      - scripts/build-tee-bundle.sh
      - pnpm-lock.yaml
      - .github/workflows/checker-image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/build-tee-bundle.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/tee
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/chaperone-checker:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/chaperone-checker:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Chaperone risk checker for an Intel TDX confidential VM
      - run: |
          echo "image: ghcr.io/${{ github.repository_owner }}/chaperone-checker@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "pnpm tee compose ghcr.io/${{ github.repository_owner }}/chaperone-checker@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
